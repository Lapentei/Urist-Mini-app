<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Личный Кабинет</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЭКРАН 1: Сплеш-скрин -->
    <div id="splash-screen" class="screen active">
        <div class="logo-container">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
            <img src="icon.png" alt="Logo" class="logo" id="user-logo">
        </div>
        <h1 id="greeting">Добрый день, загрузка...</h1>
        <p class="subtitle">Мы рядом и ведём ваше дело ❤️</p>
    </div>

    <!-- ЭКРАН 2: Главный интерфейс -->
    <div id="main-screen" class="screen">
        <header>
            <div class="header-title">
                <img src="icon.png" alt="Logo Small" class="logo-small">
                <span>ЮРИДИЧЕСКИЙ ЦЕНТР</span>
            </div>
            <!-- Иконки с подарком и обновлением удалены отсюда -->
        </header>

        <!-- БЛОК 1: АНКЕТА (Показывается только если stage = 0) -->
        <div id="application-block" style="display: none;">
            <div class="card dark-card form-card">
                <h2>Оформление заявления</h2>
                <p class="card-footer" style="margin-bottom: 20px;">Заполните данные для начала работы по вашему делу.</p>
                <form id="appForm">
                    <div class="input-group">
                        <label>Номер телефона</label>
                        <input type="tel" id="appPhone" placeholder="+7 999 000 00 00" required>
                    </div>
                    <div class="input-group">
                        <label>ФИО полностью</label>
                        <input type="text" id="appFio" placeholder="Иванов Иван Иванович" required>
                    </div>
                    <div class="input-group">
                        <label>Паспортные данные (серия, номер, кем выдан)</label>
                        <input type="text" id="appPassport" required>
                    </div>
                    <div class="input-group">
                        <label>ИНН</label>
                        <input type="text" id="appInn" required>
                    </div>
                    <div class="input-group">
                        <label>СНИЛС</label>
                        <input type="text" id="appSnils" required>
                    </div>
                    <div class="input-group">
                        <label>Ориентировочная сумма долга (в рублях)</label>
                        <input type="text" id="appDebt" placeholder="Например: 1 500 000" required>
                    </div>
                    <button type="submit" class="submit-btn">Подать заявление</button>
                </form>
            </div>
        </div>

        <!-- БЛОК 2: СТАТУС ДЕЛА (Показывается если stage > 0) -->
        <div id="progress-block" style="display: none;">
            <div class="card dark-card">
                <div class="card-subtitle">ВАШЕ ДЕЛО <span class="badge" id="stage-badge">В работе</span></div>
                <h2 id="stage-title">Загрузка...</h2>
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
                </div>
                <div class="card-footer" style="margin-bottom: 12px;">
                    <span id="stage-footer">Этап X из 13</span>
                </div>
                <!-- Добавленная кнопка просмотра всех этапов -->
                <div class="card-link" id="view-all-stages-btn" style="cursor: pointer;">Смотреть все стадии ></div>
            </div>

            <h3 class="section-title">Прикрепить документ</h3>
            <div class="card dark-card form-card">
                <form id="uploadForm">
                    <div class="input-group">
                        <label for="documentDescription">Какой документ вы хотите отправить?</label>
                        <input type="text" id="documentDescription" placeholder="Например: Скан паспорта, разворот" required>
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">Продолжить отправку</button>
                </form>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
